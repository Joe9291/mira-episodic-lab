name: round35
# Round 3.5 LM-assisted structured extraction (docs/ROUND_3_5.md): one job per model,
# split and chunk as listed in config/round35.json. Runs only if "enabled": true. No secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/round35.json"
permissions:
  contents: read
concurrency:
  group: round35
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      phase: ${{ steps.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open("config/round35.json"))
          if r["phase"] in ("timing", "probe"):
              cells = [{"model": m, "split": "dev", "chunk": 0, "chunks": 1} for m in r["models"]]
          else:
              cells = [{"model": m, "split": s, "chunk": c, "chunks": r["chunks"]}
                       for m in r["models"] for s in r["splits"] for c in range(r["chunks"])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"enabled={'true' if r.get('enabled') is True else 'false'}\n")
              out.write(f"phase={r['phase']}\n")
              out.write(f"matrix={json.dumps({'include': cells})}\n")
          PY

  encode:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r bench/m0/requirements.txt
      - name: Encode
        run: |
          mkdir -p out
          python bench/m3/run_round35.py --phase "${{ needs.plan.outputs.phase }}" --model "${{ matrix.model }}" \
            --split "${{ matrix.split }}" --chunk "${{ matrix.chunk }}" --chunks "${{ matrix.chunks }}" \
            --pins config/model_pins.json --request config/round35.json \
            --out "out/r35_${{ needs.plan.outputs.phase }}_${{ matrix.model }}_${{ matrix.split }}_${{ matrix.chunk }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-${{ matrix.model }}-${{ matrix.split }}-${{ matrix.chunk }}
          path: out/
          if-no-files-found: warn

  collect:
    needs: [plan, encode]
    if: always() && needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: r35-*
          merge-multiple: true
      - name: Store results on the results branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r . "$RUNNER_TEMP/code"
          if git fetch --depth 1 origin results 2>/dev/null; then git checkout -B results FETCH_HEAD; else git checkout --orphan results; git rm -rf --quiet .; fi
          dest="round35/run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          if [ -d incoming ]; then cp -r incoming/. "$dest/"; fi
          cp "$RUNNER_TEMP/code/config/round35.json" "$dest/request.json"
          python3 "$RUNNER_TEMP/code/bench/m3/collect_round35.py" "$RUNNER_TEMP/code/config/round35.json" "$dest" "$RUNNER_TEMP/code/config/model_pins.json" "${GITHUB_SHA}" || echo INCOMPLETE > "$dest/VERDICT"
          verdict=$(cat "$dest/VERDICT")
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} phase ${{ needs.plan.outputs.phase }} encode ${{ needs.encode.result }} fetch ${{ steps.fetch.outcome }} verdict ${verdict}" > "$dest/RUN.txt"
          git add round35
          git commit --quiet -m "Round 3.5 results (${{ needs.plan.outputs.phase }}), run ${GITHUB_RUN_ID}, ${verdict}"
          pushed=no; for try in 1 2 3 4 5; do if git push origin results; then pushed=yes; break; fi; sleep $((try * 7)); git fetch --depth 50 origin results && git rebase FETCH_HEAD; done; [ "$pushed" = yes ]
          [ "$verdict" = COMPLETE ]
