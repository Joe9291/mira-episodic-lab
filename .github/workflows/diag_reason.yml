name: diag-reason
# Round 3.1b reasoning probe (docs/ROUND_3_1.md): sub-skills S2-S5 with explicit
# reasoning (Qwen3 thinking mode; step-by-step instruction). No secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/diag_reason.json"
permissions:
  contents: read
concurrency:
  group: diag-reason
  cancel-in-progress: false
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: qwen3-0.6b, mode: think}
          - {model: qwen3-0.6b, mode: cot}
          - {model: qwen2.5-0.5b, mode: cot}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r bench/m0/requirements.txt
      - name: Run battery
        run: |
          mkdir -p out
          python bench/diag/run_diag.py --model "${{ matrix.model }}" --mode "${{ matrix.mode }}" \
            --skills S2,S3,S4,S5 --out "out/diag_${{ matrix.model }}_${{ matrix.mode }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagr-${{ matrix.model }}-${{ matrix.mode }}
          path: out/
          if-no-files-found: warn
  collect:
    needs: model
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: diagr-*
          merge-multiple: true
      - name: Store
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r . "$RUNNER_TEMP/code"
          if git fetch --depth 1 origin results 2>/dev/null; then git checkout -B results FETCH_HEAD; else git checkout --orphan results; git rm -rf --quiet .; fi
          dest="diag_reason/run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          if [ -d incoming ]; then cp -r incoming/. "$dest/"; fi
          python3 "$RUNNER_TEMP/code/bench/diag/collect_diag.py" "$dest" "qwen3-0.6b:think:S2+S3+S4+S5,qwen3-0.6b:cot:S2+S3+S4+S5,qwen2.5-0.5b:cot:S2+S3+S4+S5" || echo INCOMPLETE > "$dest/VERDICT"
          verdict=$(cat "$dest/VERDICT")
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} models ${{ needs.model.result }} verdict ${verdict}" > "$dest/RUN.txt"
          git add diag_reason
          git commit --quiet -m "Reasoning probe, run ${GITHUB_RUN_ID}, ${verdict}"
          pushed=no; for try in 1 2 3 4 5; do if git push origin results; then pushed=yes; break; fi; sleep $((try * 7)); git fetch --depth 50 origin results && git rebase FETCH_HEAD; done; [ "$pushed" = yes ]
          [ "$verdict" = COMPLETE ]
