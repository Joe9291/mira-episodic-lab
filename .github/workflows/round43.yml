name: round43
# Round 4.3 (docs/ROUND_4_3.md): source-bound consolidation, model-free. One job per family
# (phase run) or one job (phase audit), as requested in config/round43.json; runs only if
# "enabled": true; the holdout jobs refuse to start unless the freeze in the request
# matches the code and the worlds. Results go to the results branch. No secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/round43.json"
permissions:
  contents: read
concurrency:
  group: round43
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      split: ${{ steps.plan.outputs.split }}
      phase: ${{ steps.plan.outputs.phase }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open("config/round43.json"))
          fams = ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9", "T1", "T2", "T3", "T4", "T5"]
          cells = [{"families": f, "conformance": f == "P1"} for f in fams] if r["phase"] == "run" \
              else [{"families": ",".join(fams), "conformance": False}]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"enabled={'true' if r.get('enabled') is True else 'false'}\n")
              out.write(f"split={r['split']}\n")
              out.write(f"phase={r['phase']}\n")
              out.write(f"matrix={json.dumps({'include': cells})}\n")
          PY

  job:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -B -m unittest tests.test_round43 tests.test_round40
      - name: Run
        run: |
          mkdir -p out
          python -B bench/m3/run_round43.py --phase "${{ needs.plan.outputs.phase }}" --split "${{ needs.plan.outputs.split }}" \
            --families "${{ matrix.families }}" ${{ matrix.conformance && '--conformance' || '' }} \
            --request config/round43.json --out out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r43-${{ strategy.job-index }}
          path: out/
          if-no-files-found: warn

  collect:
    needs: [plan, job]
    if: always() && needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: r43-*
          merge-multiple: true
      - name: Store results on the results branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r . "$RUNNER_TEMP/code"
          if git fetch --depth 1 origin results 2>/dev/null; then git checkout -B results FETCH_HEAD; else git checkout --orphan results; git rm -rf --quiet .; fi
          dest="round43/run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          if [ -d incoming ]; then cp -r incoming/. "$dest/"; fi
          cp "$RUNNER_TEMP/code/config/round43.json" "$dest/request.json"
          if [ "${{ needs.plan.outputs.phase }}" = "run" ]; then
            python3 "$RUNNER_TEMP/code/bench/m3/collect_round43.py" --split "${{ needs.plan.outputs.split }}" --dir "$dest" \
              --counts "$RUNNER_TEMP/code/config/round43_counts.json" --request "$RUNNER_TEMP/code/config/round43.json" \
              || echo INCOMPLETE > "$dest/VERDICT"
          else
            echo AUDIT > "$dest/VERDICT"
          fi
          verdict=$(cat "$dest/VERDICT")
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} phase ${{ needs.plan.outputs.phase }} split ${{ needs.plan.outputs.split }} jobs ${{ needs.job.result }} verdict ${verdict}" > "$dest/RUN.txt"
          git add round43
          git commit --quiet -m "Round 4.3 results (${{ needs.plan.outputs.phase }}, ${{ needs.plan.outputs.split }}), run ${GITHUB_RUN_ID}, ${verdict}"
          pushed=no; for try in 1 2 3 4 5; do if git push origin results; then pushed=yes; break; fi; sleep $((try * 7)); git fetch --depth 50 origin results && git rebase FETCH_HEAD; done; [ "$pushed" = yes ]
