name: round32
# Round 3.2 agent-memory cells (docs/ROUND_3_2.md): one job per world, as listed in
# config/round32.json. Runs only if that file says "enabled": true. No secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/round32.json"
permissions:
  contents: read
concurrency:
  group: round32
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
      model: ${{ steps.plan.outputs.model }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open("config/round32.json"))
          cells = [{"series": s, "index": i} for s, idx in r["worlds"].items() for i in idx]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"enabled={'true' if r.get('enabled') is True else 'false'}\n")
              out.write(f"model={r['model']}\n")
              out.write(f"matrix={json.dumps({'include': cells})}\n")
          PY

  world:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r bench/m0/requirements.txt
      - name: Run world
        run: |
          mkdir -p out
          python bench/m3/run_round32.py --model "${{ needs.plan.outputs.model }}" --series "${{ matrix.series }}" \
            --index "${{ matrix.index }}" --pins config/model_pins.json --request config/round32.json \
            --out "out/r32_${{ matrix.series }}_${{ matrix.index }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-${{ matrix.series }}-${{ matrix.index }}
          path: out/
          if-no-files-found: warn

  collect:
    needs: [plan, world]
    if: always() && needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: r32-*
          merge-multiple: true
      - name: Store results on the results branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r . "$RUNNER_TEMP/code"
          if git fetch --depth 1 origin results 2>/dev/null; then git checkout -B results FETCH_HEAD; else git checkout --orphan results; git rm -rf --quiet .; fi
          dest="round32/run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          if [ -d incoming ]; then cp -r incoming/. "$dest/"; fi
          cp "$RUNNER_TEMP/code/config/round32.json" "$dest/request.json"
          python3 "$RUNNER_TEMP/code/bench/m3/collect_round32.py" "$RUNNER_TEMP/code/config/round32.json" "$dest" "$RUNNER_TEMP/code/config/model_pins.json" || echo INCOMPLETE > "$dest/VERDICT"
          verdict=$(cat "$dest/VERDICT")
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} worlds ${{ needs.world.result }} fetch ${{ steps.fetch.outcome }} verdict ${verdict}" > "$dest/RUN.txt"
          git add round32
          git commit --quiet -m "Round 3.2 results, run ${GITHUB_RUN_ID}, ${verdict}"
          pushed=no; for try in 1 2 3 4 5; do if git push origin results; then pushed=yes; break; fi; sleep $((try * 7)); git fetch --depth 50 origin results && git rebase FETCH_HEAD; done; [ "$pushed" = yes ]
          [ "$verdict" = COMPLETE ]
