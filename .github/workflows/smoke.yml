name: smoke
# Technical smoke test of the pinned model path (no benchmark world, nothing scored).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "episodic_lab/models.py"
      - "episodic_lab/arms.py"
      - "bench/pilot/smoke.py"
      - "config/model_pins.json"
permissions:
  contents: read
concurrency:
  group: smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [smollm2-135m, smollm2-360m, qwen2.5-0.5b, qwen3-0.6b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r bench/m0/requirements.txt
      - name: Smoke
        run: |
          mkdir -p out
          python bench/pilot/smoke.py "${{ matrix.model }}" "out/smoke_${{ matrix.model }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.model }}
          path: out/
          if-no-files-found: warn
  collect:
    needs: smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: smoke-*
          merge-multiple: true
      - name: Store
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin results 2>/dev/null; then git checkout -B results FETCH_HEAD; else git checkout --orphan results; git rm -rf --quiet .; fi
          dest="smoke/run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          if [ -d incoming ]; then cp -r incoming/. "$dest/"; fi
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} smoke ${{ needs.smoke.result }} fetch ${{ steps.fetch.outcome }}" > "$dest/RUN.txt"
          git add smoke
          git commit --quiet -m "Smoke results, run ${GITHUB_RUN_ID}, ${{ needs.smoke.result }}"
          pushed=no; for try in 1 2 3 4 5; do if git push origin results; then pushed=yes; break; fi; sleep $((try * 7)); git fetch --depth 50 origin results && git rebase FETCH_HEAD; done; [ "$pushed" = yes ]
          [ "${{ needs.smoke.result }}" = success ]
